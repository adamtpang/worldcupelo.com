<!-- @dsCard group="Brand" viewport="700x190" name="Logo lockup" subtitle="Original coin emblem (rising tri-nation bars + gold spark) + Archivo wordmark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); padding: 24px; }
  .row { display: flex; align-items: center; gap: 36px; }
  .lockup { display: inline-flex; align-items: center; gap: 10px; }
  .word { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; color: var(--text-primary); line-height: 1; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); line-height: 1.5; }
  .onlight { background: #f5f5f7; border-radius: var(--radius-md); padding: 10px 14px; display: inline-flex; align-items: center; gap: 10px; }
  .onlight .word { color: #0a0a0b; }
</style>
</head>
<body>
  <div class="row">
    <div class="lockup">
      <img src="../assets/logo-emblem.svg" width="44" height="44" alt="worldcupelo emblem" />
      <span class="word" style="font-size:30px">worldcup<span class="gold-text">elo</span></span>
    </div>
    <div class="lockup">
      <img src="../assets/logo-emblem.svg" width="28" height="28" alt="" />
      <span class="word" style="font-size:19px">worldcup<span class="gold-text">elo</span></span>
    </div>
    <img src="../assets/logo-emblem.svg" width="36" height="36" alt="emblem only" />
  </div>
  <div class="row" style="margin-top:20px">
    <div class="onlight">
      <img src="../assets/logo-emblem.svg" width="28" height="28" alt="" />
      <span class="word" style="font-size:19px">worldcup<span class="gold-text">elo</span></span>
    </div>
    <span class="meta">Emblem = gold coin · ascending CAN·MEX·USA bars · gold peak-spark<br/>Wordmark = Archivo Expanded 800, lower-case, "elo" in gold · works on dark or light</span>
  </div>
</body>
</html>
