<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="Restrained rounding — 2px flags up to 16px hero blocks" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); padding: 22px; }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 72px; height: 56px; background: var(--surface-card); border: 1px solid var(--border-strong); }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
  .tok { font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-sm); width:48px; height:48px;"></div><span class="lbl">3px</span><span class="tok">flag</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md);"></div><span class="lbl">6px</span><span class="tok">button</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg);"></div><span class="lbl">8px</span><span class="tok">card</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl);"></div><span class="lbl">12px</span><span class="tok">feature</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-2xl);"></div><span class="lbl">16px</span><span class="tok">hero</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-full); width:48px; height:48px;"></div><span class="lbl">full</span><span class="tok">pill / dot</span></div>
  </div>
</body>
</html>
