<!-- @dsCard group="Colors" viewport="700x130" name="Confederation tints" subtitle="Each region's flat brand color — used only as a 10–20% tint behind a label" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); padding: 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { display:inline-flex; flex-direction: column; gap: 2px; padding: 8px 14px; border-radius: var(--radius-md); }
  .name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .region { font-size: 9px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .08em; }
</style>
</head>
<body>
  <div class="row">
    <div class="chip" style="background: color-mix(in srgb, var(--wce-conf-uefa) 14%, transparent);"><span class="name" style="color:#4d9fe0">UEFA</span><span class="region">Europe</span></div>
    <div class="chip" style="background: color-mix(in srgb, var(--wce-conf-conmebol) 16%, transparent);"><span class="name" style="color:var(--wce-conf-conmebol)">CONMEBOL</span><span class="region">South America</span></div>
    <div class="chip" style="background: color-mix(in srgb, var(--wce-conf-concacaf) 16%, transparent);"><span class="name" style="color:#f06a72">CONCACAF</span><span class="region">North America</span></div>
    <div class="chip" style="background: color-mix(in srgb, var(--wce-conf-afc) 22%, transparent);"><span class="name" style="color:#5a8fc7">AFC</span><span class="region">Asia</span></div>
    <div class="chip" style="background: color-mix(in srgb, var(--wce-conf-caf) 16%, transparent);"><span class="name" style="color:#3cc06f">CAF</span><span class="region">Africa</span></div>
    <div class="chip" style="background: color-mix(in srgb, var(--wce-conf-ofc) 16%, transparent);"><span class="name" style="color:#3ba3da">OFC</span><span class="region">Oceania</span></div>
  </div>
</body>
</html>
