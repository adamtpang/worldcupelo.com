<!-- @dsCard group="Colors" viewport="700x180" name="Trophy gold" subtitle="The one true accent — and its gradient-clip text treatment" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); padding: 20px; }
  .scale { display: grid; grid-template-columns: repeat(9, 1fr); gap: 0; border-radius: var(--radius-md); overflow: hidden; }
  .scale div { height: 44px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; font-family: var(--font-mono); font-size: 9px; color: rgba(0,0,0,0.55); font-weight: 600; }
  .row { display: flex; align-items: center; gap: 24px; margin-top: 18px; }
  .demo { font-size: 34px; font-weight: 900; letter-spacing: -0.03em; color: var(--text-primary); }
  .chip { display:inline-flex; align-items:center; gap:8px; padding: 8px 14px; border-radius: var(--radius-md); background: linear-gradient(180deg, var(--wce-gold-bright), var(--wce-gold)); color:#000; font-weight: 700; font-size: 13px; }
  .meta { color: var(--text-tertiary); font-family: var(--font-mono); font-size: 11px; }
</style>
</head>
<body>
  <div class="scale">
    <div style="background:var(--wce-gold-100)">100</div>
    <div style="background:var(--wce-gold-200)">200</div>
    <div style="background:var(--wce-gold-300)">300</div>
    <div style="background:var(--wce-gold-400)">400</div>
    <div style="background:var(--wce-gold-500); outline: 2px solid #fff3; outline-offset:-2px;">500</div>
    <div style="background:var(--wce-gold-600); color:rgba(255,255,255,.7)">600</div>
    <div style="background:var(--wce-gold-700); color:rgba(255,255,255,.7)">700</div>
    <div style="background:var(--wce-gold-800); color:rgba(255,255,255,.7)">800</div>
    <div style="background:var(--wce-gold-900); color:rgba(255,255,255,.7)">900</div>
  </div>
  <div class="row">
    <div class="demo">world<span class="gold-text gold-glow">elo</span></div>
    <div class="demo gold-text">2171</div>
    <span class="chip">⚽ Host</span>
    <span class="meta">--wce-gold&nbsp;#D4AF37<br/>.gold-text · .gold-glow</span>
  </div>
</body>
</html>
