<!-- @dsCard group="Colors" viewport="700x150" name="Gradients" subtitle="Tri-nation rule · neon sweep · gold rating clip" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); padding: 22px; }
  .item { margin-bottom: 14px; }
  .bar { height: 28px; border-radius: var(--radius-md); }
  .rule { height: 3px; border-radius: 2px; }
  .lab { display: flex; justify-content: space-between; margin-top: 6px; }
  .name { font-size: 11px; font-weight: 600; color: var(--text-secondary); }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); }
</style>
</head>
<body>
  <div class="item">
    <div class="rule" style="background:var(--wce-gradient-trination)"></div>
    <div class="lab"><span class="name">Tri-nation accent rule — CAN → MEX → USA</span><span class="tok">--wce-gradient-trination</span></div>
  </div>
  <div class="item">
    <div class="bar" style="background:var(--wce-gradient-neon)"></div>
    <div class="lab"><span class="name">Neon sweep — magenta → cyan (We Are 26)</span><span class="tok">--wce-gradient-neon</span></div>
  </div>
  <div class="item" style="margin-bottom:0">
    <div class="bar" style="background:var(--wce-gradient-gold)"></div>
    <div class="lab"><span class="name">Gold rating clip — the signature text gradient</span><span class="tok">--wce-gradient-gold</span></div>
  </div>
</body>
</html>
