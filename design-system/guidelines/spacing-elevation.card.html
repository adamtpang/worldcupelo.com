<!-- @dsCard group="Spacing" viewport="700x160" name="Elevation & cards" subtitle="Border-driven elevation; one soft lift; gold glow for accent text" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); padding: 22px; display: flex; gap: 16px; align-items: stretch; }
  .card { flex: 1; background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: 14px 16px; }
  .card.hover { border-color: var(--wce-white-10); }
  .card.lift { box-shadow: var(--shadow-flag); }
  .card.glow { display:flex; align-items:center; justify-content:center; }
  .t { font-size: 12px; font-weight: 600; color: var(--text-primary); }
  .m { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); margin-top: 6px; }
  .big { font-family: var(--font-mono); font-weight: 900; font-size: 30px; }
</style>
</head>
<body>
  <div class="card"><div class="t">Default card</div><div class="m">card + 1px border<br/>no shadow</div></div>
  <div class="card hover"><div class="t">Hover</div><div class="m">border → white/10<br/>(or amber/40)</div></div>
  <div class="card lift"><div class="t">Soft lift</div><div class="m">--shadow-flag<br/>hero flag only</div></div>
  <div class="card glow"><span class="big gold-text gold-glow">2171</span></div>
</body>
</html>
