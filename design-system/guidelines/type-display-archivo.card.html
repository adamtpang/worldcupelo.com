<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); padding: 22px 24px; }
  .h1 { font-family: var(--font-display); font-weight: 900; font-size: 44px; letter-spacing: -0.02em; line-height: 1.02; color: var(--text-primary); }
  .h2 { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.01em; color: var(--text-primary); margin-top: 14px; text-transform: uppercase; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); margin-top: 14px; }
</style>
</head>
<body>
  <div class="h1">National-team <span class="gold-text">Elo ratings</span></div>
  <div class="h2">We Are 26</div>
  <div class="meta">Archivo Expanded · 900 / 800 · −0.02em · --font-display<br/>pairs with Inter (UI) + JetBrains Mono (numbers)</div>
</body>
</html>
