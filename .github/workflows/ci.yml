name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Lint is intentionally not a CI step. The script is `eslint .` because
      # Next 16 removed `next lint`, but the repo still has pre-existing
      # ESLint errors that are not a small fix. See the pull request body.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
